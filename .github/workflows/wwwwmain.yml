name: Build Violet IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Clone AirCard-iOS and extract AirliftFFI
        run: |
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/AirCard-iOS
          XCFW=""
          for c in "/tmp/AirCard-iOS/AirliftFFI.xcframework" \
                   "/tmp/AirCard-iOS/Frameworks/AirliftFFI.xcframework" \
                   "/tmp/AirCard-iOS/libs/AirliftFFI.xcframework"; do
            [ -d "$c" ] && XCFW="$c" && break
          done
          [ -z "$XCFW" ] && XCFW=$(find /tmp/AirCard-iOS -name "AirliftFFI.xcframework" -maxdepth 6 | head -1)
          if [ -z "$XCFW" ]; then
            echo "ERROR: AirliftFFI.xcframework not found"
            find /tmp/AirCard-iOS -type d | head -40
            exit 1
          fi
          mkdir -p Frameworks
          cp -R "$XCFW" Frameworks/AirliftFFI.xcframework
          echo "Copied AirliftFFI.xcframework from $XCFW"

      - name: Generate source files
        run: |
          GEN_B64=""
          echo "$GEN_B64" | base64 --decode > /tmp/gen_sources.py
          python3 /tmp/gen_sources.py

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          python3 - << 'EOF'
          import os, textwrap
          yml = textwrap.dedent("""
          name: Violet
          options:
            bundleIdPrefix: com.violet
            deploymentTarget:
              iOS: "18.0"
            xcodeVersion: "16.4"
          settings:
            base:
              SWIFT_VERSION: 5.0
              ENABLE_BITCODE: NO
              DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
              ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
              OTHER_LDFLAGS: "-framework XPC -lz"
          targets:
            Violet:
              type: application
              platform: iOS
              sources:
                - path: Violet
                  excludes:
                    - "**/.DS_Store"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.violet.app
                  INFOPLIST_FILE: Violet/App/Info.plist
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGN_IDENTITY: "iPhone Developer"
                  PROVISIONING_PROFILE_SPECIFIER: ""
                  DEVELOPMENT_TEAM: ""
              dependencies:
                - framework: Frameworks/AirliftFFI.xcframework
                  embed: true
          """).strip()
          with open("project.yml", "w") as f:
              f.write(yml + "\n")
          print("project.yml written")
          EOF
          xcodegen generate

      - name: Build attempt 1
        id: build1
        continue-on-error: true
        run: |
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Violet.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            2>&1 | tee build_attempt1.log
          echo "EXIT=$?" >> $GITHUB_OUTPUT

      - name: Auto-fix compile errors
        if: steps.build1.outputs.EXIT != '0'
        run: |
          FIX_B64=""
          echo "$FIX_B64" | base64 --decode > /tmp/autofix.py
          python3 /tmp/autofix.py

      - name: Build attempt 2
        id: build2
        run: |
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Violet.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            2>&1 | tee build_attempt2.log

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Violet.xcarchive -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            find build -type d | head -30
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Violet.app
          zip -r Violet.ipa Payload
          echo "IPA built: $(du -h Violet.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violet-unsigned-ipa
          path: Violet.ipa
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_attempt1.log
            build_attempt2.log
          retention-days: 3
